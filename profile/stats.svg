  <g data-testid="coding-panel" transform="translate(330, 60)">
    <rect x="0" y="0" width="110" height="100" rx="8" fill="#11121c" stroke="#70a5fd" stroke-opacity="0.35" />
    <circle cx="12" cy="12" r="3.5" fill="#ff5f56" />
    <circle cx="24" cy="12" r="3.5" fill="#ffbd2e" />
    <circle cx="36" cy="12" r="3.5" fill="#27c93f" />
