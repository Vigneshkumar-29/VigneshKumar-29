<svg
  width="467"
  height="195"
  viewBox="0 0 467 195"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Vigneshkumar S' GitHub Stats</title>
  <desc id="descId">Total Stars Earned: 16, Total Commits (last year): 129, Total PRs: 7, Total Issues: 1, Contributed to (last year): 0</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #70a5fd;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #38bdae;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size: 12px; }
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .bold { font-weight: 700 }
    .icon {
      fill: #bf91f3;
      display: block;
    }
    .code-line {
      transform-box: fill-box;
      transform-origin: left center;
      transform: scaleX(0);
      animation: typeIn 0.6s ease-out forwards;
    }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 0.9s; }
    .l3 { animation-delay: 1.5s; }
    .l4 { animation-delay: 2.1s; }
    .l5 { animation-delay: 2.7s; }
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes typeIn {
      to { transform: scaleX(1); }
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    class="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#e4e2e2"
    width="466"
    fill="#1a1b27"
    stroke-opacity="0"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="header" data-testid="header">Vigneshkumar S' GitHub Stats</text>
    </g>
  </g>

